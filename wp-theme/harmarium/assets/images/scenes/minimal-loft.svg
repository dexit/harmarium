<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="wall-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F6F2EA"/><stop offset="100%" stop-color="#EDE8DC"/></linearGradient>
    <linearGradient id="floor-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#DEDAD2"/><stop offset="100%" stop-color="#CAC5BC"/></linearGradient>
    <linearGradient id="ceil-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(0,0,0,.15)"/><stop offset="100%" stop-color="rgba(0,0,0,0)"/></linearGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#wall-g)"/>
  <rect width="1600" height="55" fill="url(#ceil-g)"/>
  <rect y="700" width="1600" height="200" fill="url(#floor-g)"/>
  <rect y="690" width="1600" height="10" fill="#C8C3BA"/>

  <!-- Shelf with books left -->
