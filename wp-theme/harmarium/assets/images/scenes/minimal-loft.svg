  <rect id="hm-artwork-zone" x="540" y="110" width="520" height="440" fill="rgba(0,0,0,.03)" data-artwork-zone="true"/>

  <!-- Minimal chair right -->
  <rect x="1260" y="580" width="220" height="120" rx="6" fill="#D4CFC8"/>
  <rect x="1260" y="420" width="18" height="164" rx="4" fill="#B8B0A4"/>
  <rect x="1462" y="420" width="18" height="164" rx="4" fill="#B8B0A4"/>
  <rect x="1255" y="576" width="232" height="14" rx="4" fill="#C8C2BA"/>
  <!-- Cushion on chair -->
  <rect x="1272" y="560" width="200" height="28" rx="6" fill="#B8A898"/>

  <!-- Small side table -->
  <rect x="1200" y="648" width="60" height="52" rx="3" fill="#C0B8AC"/>
  <rect x="1192" y="642" width="76" height="10" rx="2" fill="#D0C8BC"/>

  <!-- Thin plant stem + leaves -->
  <rect x="1508" y="594" width="6" height="106" fill="#8A8070"/>
  <rect x="1496" y="706" width="30" height="10" rx="2" fill="#7A7060"/>
  <ellipse cx="1511" cy="556" rx="52" ry="66" fill="#5A7858"/>
  <ellipse cx="1476" cy="590" rx="30" ry="42" fill="#4E6C50"/>
  <ellipse cx="1548" cy="586" rx="34" ry="48" fill="#527060"/>
