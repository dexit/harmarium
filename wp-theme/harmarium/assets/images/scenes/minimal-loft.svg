  <rect x="108" y="142" width="24" height="80" rx="2" fill="#7A9070"/>
  <rect x="136" y="152" width="16" height="70" rx="2" fill="#C0A878"/>
  <rect x="156" y="144" width="20" height="78" rx="2" fill="#9898B8"/>
  <rect x="180" y="150" width="18" height="72" rx="2" fill="#B07878"/>
  <rect x="202" y="140" width="26" height="82" rx="2" fill="#A8A098"/>
  <rect x="232" y="146" width="22" height="76" rx="2" fill="#88A8A0"/>
  <rect x="258" y="152" width="20" height="70" rx="2" fill="#C0B090"/>

