<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="wall-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1C1A18"/><stop offset="100%" stop-color="#141210"/></linearGradient>
    <linearGradient id="floor-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#252220"/><stop offset="100%" stop-color="#1A1816"/></linearGradient>
    <radialGradient id="spot1" cx="50%" cy="0%" r="55%"><stop offset="0%" stop-color="rgba(255,240,200,.35)"/><stop offset="100%" stop-color="rgba(255,240,200,0)"/></radialGradient>
    <radialGradient id="spot2" cx="50%" cy="0%" r="45%"><stop offset="0%" stop-color="rgba(255,240,200,.2)"/><stop offset="100%" stop-color="rgba(255,240,200,0)"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="100%" r="60%"><stop offset="0%" stop-color="rgba(255,240,200,.08)"/><stop offset="100%" stop-color="rgba(0,0,0,0)"/></radialGradient>
  </defs>
  <!-- Dark gallery wall -->
  <rect width="1600" height="720" fill="url(#wall-g)"/>
  <!-- Floor -->
  <rect y="720" width="1600" height="180" fill="url(#floor-g)"/>
  <!-- Baseboard fine line -->
  <rect y="718" width="1600" height="4" fill="#2A2824" opacity=".8"/>

  <!-- Track lighting rail -->
  <rect x="0" y="24" width="1600" height="8" rx="4" fill="#2A2824"/>
  <!-- Light fixtures left -->
  <rect x="380" y="0" width="6" height="28" fill="#242220"/>
  <polygon points="368,28 400,28 390,60 378,60" fill="#1E1C1A"/>
  <ellipse cx="384" cy="60" rx="18" ry="6" fill="#C8A850" opacity=".6"/>
  <!-- Light fixtures right -->
  <rect x="1214" y="0" width="6" height="28" fill="#242220"/>
  <polygon points="1202,28 1234,28 1224,60 1212,60" fill="#1E1C1A"/>
  <ellipse cx="1218" cy="60" rx="18" ry="6" fill="#C8A850" opacity=".6"/>

  <!-- Left artwork spotlight cone -->
  <polygon points="384,66 180,720 580,720" fill="rgba(255,240,180,.04)"/>
  <!-- Right artwork spotlight cone -->
  <polygon points="1218,66 1016,720 1420,720" fill="rgba(255,240,180,.03)"/>

  <!-- ARTWORK ZONE — centre prime -->
  <rect id="hm-artwork-zone" x="552" y="108" width="496" height="420" fill="rgba(255,255,255,.03)" data-artwork-zone="true"/>

  <!-- Artwork spot glow on wall -->
  <ellipse cx="800" cy="400" rx="360" ry="320" fill="url(#spot1)" opacity=".6"/>
  <!-- Floor reflection -->
  <ellipse cx="800" cy="720" rx="300" ry="24" fill="rgba(255,240,200,.06)"/>

  <!-- Left side art (suggestion of adjacent works) -->
  <rect x="80" y="220" width="200" height="280" fill="#2C2A26"/>
  <rect x="80" y="220" width="200" height="280" stroke="#3A3830" stroke-width="4" fill="none"/>
  <!-- Right side art -->
  <rect x="1320" y="240" width="200" height="240" fill="#2C2A26"/>
  <rect x="1320" y="240" width="200" height="240" stroke="#3A3830" stroke-width="4" fill="none"/>

  <!-- Left label plate -->
  <rect x="140" y="516" width="80" height="14" rx="2" fill="#2A2824"/>
  <!-- Right label plate -->
  <rect x="1368" y="496" width="80" height="14" rx="2" fill="#2A2824"/>

  <!-- Floor subtle highlight line -->
  <rect y="720" width="1600" height="2" fill="rgba(255,240,200,.06)"/>
</svg>
