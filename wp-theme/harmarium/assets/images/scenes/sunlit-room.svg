<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="wall-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F5EDDC"/><stop offset="100%" stop-color="#EEE2CC"/></linearGradient>
    <linearGradient id="floor-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D4C8A8"/><stop offset="100%" stop-color="#BEB290"/></linearGradient>
    <linearGradient id="ceil-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(0,0,0,.16)"/><stop offset="100%" stop-color="rgba(0,0,0,0)"/></linearGradient>
    <linearGradient id="sun-g" x1="1" y1="0" x2="0" y2="0"><stop offset="0%" stop-color="rgba(255,235,160,.32)"/><stop offset="100%" stop-color="rgba(255,235,160,0)"/></linearGradient>
    <linearGradient id="sunfl-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(255,235,160,.22)"/><stop offset="100%" stop-color="rgba(255,235,160,0)"/></linearGradient>
  </defs>
  <!-- Wall -->
  <rect width="1600" height="690" fill="url(#wall-g)"/>
  <rect width="1600" height="55" fill="url(#ceil-g)"/>
  <!-- Floor -->
  <rect y="690" width="1600" height="210" fill="url(#floor-g)"/>
  <rect y="682" width="1600" height="8" fill="#C8BC98"/>

  <!-- Large window far right flooding sun -->
  <rect x="1368" y="0" width="232" height="690" fill="rgba(200,225,255,.22)" stroke="#D8C8A4" stroke-width="6"/>
  <line x1="1484" y1="0" x2="1484" y2="690" stroke="#D8C8A4" stroke-width="5"/>
  <line x1="1368" y1="345" x2="1600" y2="345" stroke="#D8C8A4" stroke-width="5"/>
  <!-- Window sheer curtain -->
  <rect x="1368" y="0" width="232" height="690" fill="rgba(255,250,240,.18)"/>
  <!-- Sunlight beam from window -->
  <polygon points="1368,0 1600,0 1600,690 1368,690" fill="url(#sun-g)"/>
  <!-- Sun on floor -->
  <polygon points="1368,690 1600,690 1600,900 1100,900" fill="url(#sunfl-g)"/>

  <!-- ARTWORK ZONE -->
  <rect id="hm-artwork-zone" x="524" y="112" width="510" height="418" fill="rgba(0,0,0,.03)" data-artwork-zone="true"/>

  <!-- Round dining table -->
  <ellipse cx="380" cy="756" rx="200" ry="60" fill="#8A7450"/>
  <ellipse cx="380" cy="720" rx="200" ry="16" fill="#9A8460"/>
  <rect x="364" y="720" width="16" height="120" fill="#786040"/>
  <!-- Chair 1 -->
  <rect x="200" y="670" width="80" height="70" rx="6" fill="#C8B890"/>
  <rect x="210" y="740" width="60" height="10" rx="2" fill="#B8A880"/>
  <rect x="208" y="740" width="10" height="50" fill="#A89870"/>
  <rect x="258" y="740" width="10" height="50" fill="#A89870"/>
  <rect x="200" y="638" width="80" height="36" rx="5" fill="#B8A880"/>
  <!-- Chair 2 -->
  <rect x="464" y="668" width="80" height="70" rx="6" fill="#C8B890"/>
  <rect x="474" y="738" width="60" height="10" rx="2" fill="#B8A880"/>
  <rect x="472" y="738" width="10" height="52" fill="#A89870"/>
  <rect x="522" y="738" width="10" height="52" fill="#A89870"/>
  <rect x="464" y="636" width="80" height="36" rx="5" fill="#B8A880"/>
  <!-- Vase on table -->
  <rect x="356" y="660" width="46" height="58" rx="8" fill="#D4C8A0"/>
  <rect x="360" y="660" width="38" height="10" rx="4" fill="#E0D4AC"/>
  <!-- Flowers in vase -->
  <circle cx="365" cy="652" r="14" fill="#D08040"/>
  <circle cx="380" cy="646" r="16" fill="#C07030"/>
  <circle cx="396" cy="650" r="13" fill="#D49050"/>
  <circle cx="375" cy="638" r="10" fill="#E0A060"/>

  <!-- Floor shadow -->
  <ellipse cx="380" cy="760" rx="220" ry="28" fill="rgba(0,0,0,.10)"/>

  <!-- Hanging plant left -->
  <rect x="110" y="0" width="4" height="90" fill="#A09080"/>
  <ellipse cx="112" cy="120" rx="70" ry="55" fill="#5A8050"/>
  <ellipse cx="78" cy="148" rx="40" ry="32" fill="#4E7048"/>
  <ellipse cx="148" cy="144" rx="38" ry="30" fill="#527858"/>
</svg>
